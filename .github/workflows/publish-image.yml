name: Publish OpenMAIC image (GHCR)

# Builds the production image off-host (the Dokploy server is memory-constrained)
# and publishes it to ghcr.io/<owner>/openmaic. Dokploy pulls the image; it never
# builds from source. NEXT_PUBLIC_* values are compiled into the browser bundle
# at build time, so the persistence / workbench flags are fixed here.

on:
  workflow_dispatch:
  push:
    branches: [feat/dokploy-tailnet-deploy]
    paths-ignore:
      - '**.md'
      - 'deploy/**'

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openmaic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=tailnet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_PERSISTENCE=1
            NEXT_PUBLIC_PERSISTENCE_TOKEN=${{ vars.OPENMAIC_PERSISTENCE_TOKEN || 'openmaic-tailnet-dev' }}
            NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=true
            NEXT_PUBLIC_ENABLE_PPTX_IMPORT=true
